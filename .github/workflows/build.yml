name: Build
on:
  push:
    paths-ignore:
      - 'reference/**'
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and package
        run: gradle clean build --stacktrace
      - name: Upload rebuilt artifacts for audit
        uses: actions/upload-artifact@v4
        with:
          name: selective-quest-submission-recovered-build
          path: build/libs/*.jar
